/* ===== buy from balance ===== */
function openBuyConfirm(it,qty){
  qty=Math.max(1,Math.min(10,Math.round(Number(qty)||1)));
  var bal=ME.balance,subtotal=it.price*qty;
  var promo=null; // {code,discount} — "Qo'llash" bosilib tasdiqlangandan keyin to'ladi
  function total(){return Math.max(0,subtotal-(promo?promo.discount:0));}
  function enough(){return bal!==null&&bal>=total();}
  var sh=openSheet(
    tileHTML(it,true)
    +'<h2>'+esc(t("buy_confirm"))+'</h2>'
    +'<div class="refline"><span>'+esc(loc(it.title))+(qty>1?(' ×'+qty):'')+'</span><b>'+esc(money(subtotal))+'</b></div>'
    +'<div id="promoLine"></div>'
    +'<div class="arow" style="margin:8px 0"><input id="promoInput" placeholder="'+esc(t("promo_placeholder"))+'" style="text-transform:uppercase"><button class="btn sm" id="promoApplyBtn">'+esc(t("promo_apply"))+'</button></div>'
    +'<div id="promoMsg"></div>'
    +'<div class="refline"><span>'+esc(t("bal_title"))+'</span><b>'+(bal===null?"…":esc(money(bal)))+'</b></div>'
    +'<div id="afterLine"></div>'
    +'<div style="height:12px"></div>'
    +'<div id="buyActionArea"></div>'
  );
  function renderTotals(){
    var pl=sh.querySelector("#promoLine");
    pl.innerHTML=promo?('<div class="refline"><span>'+esc(t("promo_discount"))+' ('+esc(promo.code)+')</span><b style="color:var(--acc)">−'+esc(money(promo.discount))+'</b></div>'):'';
    var al=sh.querySelector("#afterLine");
    var ok=enough();
    al.innerHTML=ok?('<div class="refline"><span>'+esc(t("after_left"))+'</span><b>'+esc(money(bal-total()))+'</b></div>'):'';
    var area=sh.querySelector("#buyActionArea");
    area.innerHTML=ok
      ?'<button class="btn big green" id="doBuy">'+esc(t("pay_from_balance"))+' — '+esc(money(total()))+'</button>'
      :'<div class="paynote">'+ic("warning",13)+' '+esc(t("need_more"))+'</div><button class="btn big" id="goTopup">'+ic("plus",15)+' '+esc(t("bal_topup"))+'</button>';
    bindActionButtons();
  }
  function bindActionButtons(){
    var b=sh.querySelector("#doBuy");
    if(b)b.addEventListener("click",function(){
      b.disabled=true;b.textContent=t("processing");
      api("/api/buy","POST",{itemId:it.id,quantity:qty,promoCode:promo?promo.code:undefined}).then(function(r){
        ME.balance=r.balance;haptic("ok");closeSheet();
        loadMe(function(){
          if(r.order&&r.order.delivered){showDeliveredSheet(it,r.order);}
          else{toast(t("bought_ok"));}
          go("orders");
        });
      }).catch(function(e){
        var code=e.resp&&e.resp.error;
        if(code==="balance"){closeSheet();toast(t("need_more"));go("pay");}
        else if(code==="out_of_stock"){closeSheet();toast(t("out_stock"));render();}
        else if(code==="no_username"){closeSheet();toast(t("need_username"));}
        else if(code==="fragment_failed"){closeSheet();toast((e.resp.message)||t("fragment_err"));}
        else if(code==="promo_invalid"){promo=null;renderTotals();toast(t("promo_bad"),true);}
        else{
          /* real network/server failure — keep the sheet open so the buyer can just retry, instead of losing context */
          b.disabled=false;b.textContent=t("pay_from_balance");
          var note=sh.querySelector("#doBuyErr");
          if(!note){note=document.createElement("div");note.id="doBuyErr";note.className="paynote";note.style.color="var(--err)";b.insertAdjacentElement("afterend",note);}
          note.innerHTML=ic("warning",13)+' '+esc(t("srv_off"));
          haptic();
        }
      });
    });
    var g=sh.querySelector("#goTopup");
    if(g)g.addEventListener("click",function(){
      var need=total()-(bal||0);
      S.topup.amount=Math.max(MIN_AMOUNT,Math.ceil(need/1000)*1000);
      closeSheet();go("pay");
    });
  }
  sh.querySelector("#promoApplyBtn").addEventListener("click",function(){
    var code=(sh.querySelector("#promoInput").value||"").trim().toUpperCase();
    if(!code)return;
    var btn=this;btn.disabled=true;
    api("/api/promo/check","POST",{itemId:it.id,quantity:qty,code:code}).then(function(r){
      btn.disabled=false;
      promo={code:r.code,discount:r.discount};
      sh.querySelector("#promoMsg").innerHTML='<div class="paynote" style="color:var(--acc)">'+ic("gift",13)+' '+esc(t("promo_ok"))+'</div>';
      haptic("ok");renderTotals();
    }).catch(function(e){
      btn.disabled=false;
      sh.querySelector("#promoMsg").innerHTML='<div class="paynote" style="color:var(--err)">'+ic("warning",13)+' '+esc(t("promo_bad"))+'</div>';
      haptic();
    });
  });
  renderTotals();
}

var TOPUP_ERR=false;
function createTopup(){
  var el=document.getElementById("payAmount");
  var amount=Math.round(Number(el&&el.value)||0);
  if(!amount||amount<MIN_AMOUNT){toast(t("amount_low"));return;}
  if(!S.topup.method){toast(t("choose_method"));return;}
  if(S.topup.method==="bank"){
    var msg=t("bank_support_msg").replace("{amount}",money(amount));
    openLink("https://t.me/"+SUPPORT_USERNAME+"?text="+encodeURIComponent(msg));
    return;
  }
  TOPUP_ERR=false;
  var btn=document.getElementById("topupGo");
  if(btn){btn.disabled=true;btn.textContent=t("processing");}
  api("/api/topup","POST",{amount:amount,method:S.topup.method}).then(function(r){
    S.activePay={id:r.payment.id,pay:r.payment.pay,amount:r.payment.amount,method:r.payment.method,expiresAt:r.expiresAt};
    MARKPAID_ERR=false;
    persist();haptic("ok");toast(t("topup_created"));render();
  }).catch(function(){
    TOPUP_ERR=true;haptic();render();
  });
}
var MARKPAID_ERR=false;
function markPaid(){
  var ap=S.activePay;if(!ap)return;
  MARKPAID_ERR=false;
  var btn=document.getElementById("pwPaid");
  if(btn){btn.disabled=true;btn.textContent=t("processing");}
  api("/api/paid","POST",{id:ap.id}).then(function(){
    S.activePay=null;persist();haptic("ok");
    loadMe(function(){go("orders");});
  }).catch(function(e){
    var code=e.resp&&e.resp.error;
    if(code==="state"||code==="not found"){
      /* server already moved past "waiting" (e.g. admin already processed it) — safe to continue */
      S.activePay=null;persist();loadMe(function(){go("orders");});
      return;
    }
    /* real network/server failure — keep the payment window open so nothing gets lost silently */
    MARKPAID_ERR=true;haptic();render();
  });
}
function tickTimer(){
  var ap=S.activePay;if(!ap)return;
  var el=document.getElementById("pwTimer");
  var left=Math.floor((ap.expiresAt-Date.now())/1000);
  if(left<=0){
    S.activePay=null;persist();
    if(S.screen==="pay"){render();showExpiredSheet();}
    return;
  }
  if(el){
    el.textContent=("0"+Math.floor(left/60)).slice(-2)+":"+("0"+(left%60)).slice(-2);
    el.classList.toggle("urgent",left<=60);
  }
  var bar=document.getElementById("pwTimerBar");
  if(bar){
    // To'lov oynasi umumiy davomiyligi (server TOPUP_TTL bilan bir xil — 10 daqiqa) —
    // progress-bar shu nisbatda kamayib boradi (vaqt tugashiga qancha qolganini vizual ko'rsatadi).
    var totalSec=7*60;
    var pct=Math.max(0,Math.min(100,(left/totalSec)*100));
    bar.style.width=pct+"%";
    bar.classList.toggle("urgent",left<=60);
  }
}

// JAP'dan inglizcha xom holatda keladigan status matnini (Pending/In progress/
// Completed/Partial/Canceled/Refunded va h.k.) joriy tilga o'giradi. Tanish
// bo'lmagan/kutilmagan matn kelsa — asl matnning o'zi ko'rsatiladi (yo'qotilmaydi).
function nkStatusLabel(raw){
  var s=String(raw||"").toLowerCase().trim();
  if(!s)return "";
  if(s==="completed")return t("nk_st_completed");
  if(s==="partial")return t("nk_st_partial");
  if(s==="canceled"||s==="cancelled")return t("nk_st_canceled");
  if(s==="refunded")return t("nk_st_refunded");
  if(s==="processing")return t("nk_st_processing");
  if(s==="in progress"||s==="inprogress")return t("nk_st_inprogress");
  if(s==="pending")return t("nk_st_pending");
  return raw;
}
// Faqat 4 ta asosiy tarmoq mijozlarga ko'rsatiladi — server buni allaqachon filtrlab
// beradi (har bir xizmatda "app" maydoni bilan), shu sabab bu yerda faqat fallback sifatida
// (masalan eski keshlangan javob uchun) kalit so'zlar bo'yicha aniqlash saqlanadi.
var NK_APP_META={
  tg:{name:"Telegram",color:"#2AABEE",icon:"send"},
  insta:{name:"Instagram",color:"#C13584",icon:"instagram"},
  tiktok:{name:"TikTok",color:"#111111",icon:"tiktok"},

};
var NK_APP_ORDER=["tg","insta","tiktok","yt"];
// JAP API'dan xizmat/kategoriya nomlari doim inglizcha keladi ("Members","Views",
// "Reactions" va h.k.). Bu "aqlli lug'at" — mijoz tiliga qarab shu kalit so'zlarni
// (butun so'z sifatida, \b chegarasi bilan) mos tilga almashtiradi, qolgan matn
// ([Refill: 7D] kabi texnik qismlar, sonlar) o'zgarishsiz qoladi. Lug'atda yo'q
// so'z — original holicha qoladi (hech narsa yo'qotilmaydi).
var SMM_DICT={
  uz:{
    Members:"Obunachilar",Member:"Obunachi",Subscribers:"Obunachilar",Subscriber:"Obunachi",
    Followers:"Obunachilar",Follower:"Obunachi",Views:"Ko'rishlar",View:"Ko'rish",

    Comments:"Izohlar",Comment:"Izoh",Shares:"Ulashishlar",Share:"Ulashish",

    Boost:"Boost",Boosts:"Boostlar",Premium:"Premium",Reposts:"Repostlar",Repost:"Repost",
    Impressions:"Ko'rsatishlar",Saves:"Saqlashlar",Save:"Saqlash",Story:"Hikoya",Stories:"Hikoyalar",
    Live:"Jonli efir",Auto:"Avto",Refill:"Qayta to'ldirish",Guaranteed:"Kafolatlangan"
  },
  ru:{
    Members:"Подписчики",Member:"Подписчик",Subscribers:"Подписчики",Subscriber:"Подписчик",
    Followers:"Подписчики",Follower:"Подписчик",Views:"Просмотры",View:"Просмотр",
    Reactions:"Реакции",Reaction:"Реакция",Likes:"Лайки",Like:"Лайк",
    Comments:"Комментарии",Comment:"Комментарий",Shares:"Репосты",Share:"Репост",
    Votes:"Голоса",Vote:"Голос",Poll:"Опрос",Polls:"Опросы",
    Boost:"Буст",Boosts:"Бусты",Premium:"Премиум",Reposts:"Репосты",Repost:"Репост",

  }
};
var _smmDictWordsCache={};
function smmTranslate(str){
  str=String(str||"");
  if(!str||S.lang==="en")return str;
  var dict=SMM_DICT[S.lang];
  if(!dict)return str;
  var words=_smmDictWordsCache[S.lang];
  if(!words)words=_smmDictWordsCache[S.lang]=Object.keys(dict).sort(function(a,b){return b.length-a.length;});
  var out=str;
  for(var i=0;i<words.length;i++){
    var w=words[i];
    out=out.replace(new RegExp("\\b"+w+"\\b","g"),dict[w]);
  }
  return out;
}
function nakrutkaAppOf(svc){
  if(svc.app&&NK_APP_META[svc.app])return svc.app;
  var s=((svc.category||"")+" "+(svc.name||"")).toLowerCase();
  if(s.indexOf("telegram")!==-1||s.indexOf(" tg ")!==-1)return "tg";
  if(s.indexOf("instagram")!==-1||s.indexOf("insta")!==-1)return "insta";
  if(s.indexOf("tiktok")!==-1||s.indexOf("tik tok")!==-1)return "tiktok";
  if(s.indexOf("youtube")!==-1||s.indexOf(" yt ")!==-1)return "yt";
  return "other";
}

function nkCatIcon(label){
  var s=String(label||"").toLowerCase();
  if(s.indexOf("subscri")!==-1||s.indexOf("member")!==-1||s.indexOf("follow")!==-1)return "users";
  if(s.indexOf("react")!==-1||s.indexOf("like")!==-1)return "heart";
  if(s.indexOf("view")!==-1)return "eye";
  if(s.indexOf("comment")!==-1)return "send";
  if(s.indexOf("boost")!==-1)return "bolt";
  if(s.indexOf("poll")!==-1||s.indexOf("vote")!==-1)return "trophy";
  if(s.indexOf("share")!==-1)return "share";
  return "trendUp";
}
// "Telegram - Members" kabi xom kategoriya nomidan ilova nomini olib tashlab, tozalab beradi
function nkCatLabel(raw,appName){
  var s=String(raw||"").replace(new RegExp(appName,"ig"),"").replace(/^[\s\-–|:]+|[\s\-–|:]+$/g,"");
  return s||raw||t("group_other");
}
// Xizmatlar ro'yxati (4 tarmoq bo'yicha allaqachon serverda filtrlangan) — panel va
// umumiy qidiruv o'rtasida qayta ishlatish uchun soddagina xotira-kesh (5 daqiqa).
var NkCache={ts:0,flat:null,usdRate:0,catMeta:null,promise:null};
function loadNkFlat(){
  if(NkCache.flat&&Date.now()-NkCache.ts<5*60*1000)return Promise.resolve(NkCache.flat);
  if(NkCache.promise)return NkCache.promise;
  NkCache.promise=api("/api/nakrutka/services").then(function(r){
    var list=r.services||[];
    NkCache={ts:Date.now(),flat:list,usdRate:Number(r.usdRate)||NAKRUTKA_USD_RATE,catMeta:r.catMeta||{},promise:null};
    return list;
  }).catch(function(e){NkCache.promise=null;throw e;});
  return NkCache.promise;
}
// Umumiy qidiruv ekranida ("Mahsulotlar" bo'limi) foydalanish uchun — endi hali
// yuklanmagan bo'lsa jim tarzda yuklab, tayyor bo'lgach ekranni qayta chizadi.
function ensureNkLoadedForSearch(){
  if(NkCache.flat)return;
  loadNkFlat().then(function(){
    if(S.screen==="products"&&(S.products.search||"").trim())render();
  }).catch(function(){});
}
// Bosh sahifadagi "Nakrutka" kartochkasida jami mahsulot sonini ko'rsatish uchun —
// hali yuklanmagan bo'lsa jim tarzda yuklaydi va tayyor bo'lgach bosh sahifani qayta chizadi.
function ensureNkLoadedForHome(){
  if(NkCache.flat)return;
  loadNkFlat().then(function(){
    if(S.screen==="home"&&!S.category&&!S.group)render();
  }).catch(function(){});
}
// Admin "bo'lim" (butun tarmoq — Telegram/Instagram/TikTok/YouTube) yoki "guruh"
// (tarmoq ichidagi bitta kategoriya, masalan Telegram->Members) darajasida yashirishi
// mumkin. Bu holat alohida backend maydon talab qilmaydi — mavjud
// "/api/admin/nakrutka/catmeta" saqlash joyidan (har bir kalit uchun ixtiyoriy
// {img,hidden} obyekti) qayta foydalaniladi. Butun tarmoq uchun maxsus kalit: "app::__app__".
function nkAppKey(app){return app+"::__app__";}
function nkIsHidden(catMeta,key){return !!(catMeta&&catMeta[key]&&catMeta[key].hidden);}
// Mijozga ko'rsatiladigan yakuniy ro'yxat — admin yashirgan butun tarmoqlar va
// alohida guruhlarni chiqarib tashlaydi. Nakrutka ekrani, qidiruv va bosh
// sahifadagi umumiy son shu funksiyadan foydalanadi (barchasi bir xil holatni ko'radi).
function nkVisibleFlat(){
  var list=NkCache.flat||[],catMeta=NkCache.catMeta||{};
  return list.filter(function(s){
    var app=nakrutkaAppOf(s);
    if(nkIsHidden(catMeta,nkAppKey(app)))return false;
    if(nkIsHidden(catMeta,app+"::"+(s.category||"")))return false;
    return true;
  });
}
// Bitta xizmat uchun buyurtma darchasi (havola + miqdor + UZS'dagi jami narx) —
// nakrutka panelidan ham, umumiy qidiruv natijasidan ham chaqiriladi.
function nkRenderOrderForm(container,svc,backLabel,onBack){
  var h=(onBack?('<button class="backrow" data-nk-back-x="1">'+ic("arrowLeft",16)+' <b>'+esc(backLabel)+'</b></button>'):'')
    +'<div style="padding:0 16px 4px"><div style="font-weight:700;font-size:14.5px">'+esc(smmTranslate(svc.name))+'</div>'
    +'<div class="d" style="margin-top:2px">'+esc(t("nakrutka_min_max").replace("{min}",svc.min).replace("{max}",svc.max))+'</div>'
    +'<label>'+esc(t("nakrutka_link_label"))+'</label>'
    +'<input id="nkLink" placeholder="'+esc(t("nakrutka_link_ph"))+'">'
    +'<label>'+esc(t("nakrutka_qty_label"))+'</label>'
    +'<div class="amount"><input id="nkQty" type="number" inputmode="numeric" placeholder="'+svc.min+'"><span class="cur">'+esc(t("nakrutka_qty_unit"))+'</span></div>'
    +'<div id="nkQtyErr" class="paynote" style="display:none;color:#e74c3c"></div>'
    +'<div class="refline" style="margin-top:10px"><span>'+esc(t("nakrutka_total_label"))+'</span><b id="nkTotal">'+money(0)+'</b></div>'
    +'<div id="nkBalWarn" class="paynote" style="display:none;color:#e74c3c"></div>'
    +'<div style="height:12px"></div>'
    +'<button class="btn big" id="nkOrderBtn" disabled>'+esc(t("nakrutka_order_btn"))+'</button>'
    +'<div style="height:10px"></div></div>';
  container.innerHTML=h;
  if(onBack){
    var back=container.querySelector("[data-nk-back-x]");
    if(back)back.addEventListener("click",function(){haptic();onBack();});
  }
  var qtyEl=container.querySelector("#nkQty"),linkEl=container.querySelector("#nkLink"),errEl=container.querySelector("#nkQtyErr"),
      totalEl=container.querySelector("#nkTotal"),balWarnEl=container.querySelector("#nkBalWarn"),btnEl=container.querySelector("#nkOrderBtn");
  function recalc(){
    var qty=parseInt(qtyEl.value)||0;
    var totalUsd=qty>0?(qty*svc.rate/1000):0;
    var totalUzs=Math.round(totalUsd*(NkCache.usdRate||NAKRUTKA_USD_RATE));
    totalEl.textContent=money(totalUzs);
    var qtyOk=qty>0&&qty>=svc.min&&qty<=svc.max;
    if(qty>0&&!qtyOk){
      errEl.textContent=t("nakrutka_qty_range").replace("{min}",svc.min).replace("{max}",svc.max);
      errEl.style.display="block";
    }else errEl.style.display="none";
    var balOk=totalUzs>0&&totalUzs<=(ME.balance||0);
    if(qty>0&&qtyOk&&!balOk){
      balWarnEl.innerHTML=ic("warning",13)+" "+esc(t("need_more"));
      balWarnEl.style.display="block";
    }else balWarnEl.style.display="none";
    var linkOk=linkEl.value.trim().length>3;
    btnEl.disabled=!(qtyOk&&balOk&&linkOk);
    btnEl.textContent=t("nakrutka_order_btn")+(qtyOk?" — "+money(totalUzs):"");
  }
  qtyEl.addEventListener("input",recalc);
  linkEl.addEventListener("input",recalc);
  recalc();
  btnEl.addEventListener("click",function(){
    if(btnEl.disabled)return;
    var qty=parseInt(qtyEl.value)||0,link=linkEl.value.trim();
    btnEl.disabled=true;btnEl.textContent=t("processing");
    api("/api/nakrutka/buy","POST",{service:svc.service,link:link,quantity:qty}).then(function(r){
      ME.balance=r.balance;
      haptic("ok");closeSheet();toast(t("nakrutka_order_ok"));go("orders");
    }).catch(function(e){
      var msg=t("srv_off");
      if(e.resp&&e.resp.error==="balance")msg=t("need_more");
      else if(e.resp&&e.resp.error==="qty_range")msg=t("nakrutka_qty_range").replace("{min}",e.resp.min).replace("{max}",e.resp.max);
      toast(msg,true);
      recalc();
    });
  });
}
// Bir ilova (app) uchun kategoriyalarga bo'lish — {label:[services]} va
// {label:xom_kategoriya_nomi} (catMeta rasmini topish uchun) qaytaradi.
function nkGroupByCat(app,byApp,meta){
  var services=byApp[app]||[];
  var cats={},catsRaw={};
  for(var k=0;k<services.length;k++){
    var rawCat=services[k].category||"";
    var label=nkCatLabel(rawCat,meta.name);
    (cats[label]=cats[label]||[]).push(services[k]);
    if(!catsRaw[label])catsRaw[label]=rawCat;
  }
  return {cats:cats,catsRaw:catsRaw};
}

// Nakrutka bo'limini boshqa har qanday kategoriya kabi TO'LIQ SAHIFA sifatida chizadi
// (Telegram/Games kabi — orqaga strelkasi + tab-bar ko'rinib turadi), pastdan chiqadigan
// oyna (sheet) o'rniga. Qavatlar S.nk{app,cat} orqali kuzatiladi:
// app=null            -> 1-qavat: 4 ta ilova kartochkasi
// app bor, cat=null   -> 2-qavat: shu ilovaning kategoriyalari
// app va cat bor      -> 3-qavat: shu kategoriya ichidagi xizmatlar (grid, narxsiz)
// Xizmat bosilganda    -> 4-qavat: buyurtma darchasi (alohida sheet sifatida ochiladi)
function nakrutkaScreenHTML(){
  var backTop='<button class="backrow" data-nk-back-top="1">'+ic("arrowLeft",16)+' <b>';
  if(!NkCache.flat){
    ensureNkPageLoaded();
    return backTop+esc(t("nakrutka_title"))+'</b></button>'
      +'<div class="paynote" style="text-align:center;padding:40px 0;color:var(--mut)">'+esc(t("nakrutka_loading"))+'</div>';
  }
  var list=nkVisibleFlat(),catMeta=NkCache.catMeta||{};
  var byApp={};
  for(var i=0;i<list.length;i++){var a=nakrutkaAppOf(list[i]);(byApp[a]=byApp[a]||[]).push(list[i]);}
  var apps=NK_APP_ORDER.filter(function(a){return byApp[a]&&byApp[a].length;});
  if(!apps.length)return backTop+esc(t("nakrutka_title"))+'</b></button><div class="paynote">'+esc(t("nakrutka_load_err"))+'</div>';

  // 3-qavat: xizmatlar (tanlangan kategoriya ichida)
  if(S.nk.app&&S.nk.cat){
    var app3=S.nk.app,meta3=NK_APP_META[app3];
    if(!meta3||apps.indexOf(app3)===-1){S.nk={app:null,cat:null};return nakrutkaScreenHTML();}
    var g3=nkGroupByCat(app3,byApp,meta3);
    var services=g3.cats[S.nk.cat]||[];
    var list2=services.slice(0,60);
    NK_PAGE_SVC_LIST=list2;
    var h3='';
    for(var i2=0;i2<list2.length;i2++){
      var s=list2[i2];
      h3+='<button class="pcard" data-nk-svc="'+i2+'">'
        +'<div class="ptile" style="background:'+meta3.color+'18;color:'+meta3.color+'">'+ic("trendUp",26)+'</div>'
        +'<div class="pbody"><div class="nm">'+esc(smmTranslate(s.name))+'</div><div class="ct">'+esc(t("nakrutka_min_max").replace("{min}",s.min).replace("{max}",s.max))+'</div></div></button>';
    }
    return '<button class="backrow" data-nk-back-top="1">'+ic("arrowLeft",16)+' <b>'+esc(smmTranslate(S.nk.cat))+'</b></button>'
      +'<div class="grid svcgrid">'+(h3||'<div class="empty">'+esc(t("nakrutka_load_err"))+'</div>')+'</div>';
  }

  // 2-qavat: tanlangan ilovaning kategoriyalari
  if(S.nk.app){
    var app2=S.nk.app,meta2=NK_APP_META[app2];
    if(!meta2||apps.indexOf(app2)===-1){S.nk={app:null,cat:null};return nakrutkaScreenHTML();}
    var g2=nkGroupByCat(app2,byApp,meta2);
    var labels=Object.keys(g2.cats).sort();
    var h2='';
    for(var m=0;m<labels.length;m++){
      var lb=labels[m];
      var metaKey=app2+"::"+g2.catsRaw[lb];
      var groupImg=catMeta[metaKey]&&catMeta[metaKey].img;
      var tile=groupImg?'<img src="'+esc(groupImg)+'" alt="" loading="lazy" style="width:100%;height:100%;object-fit:cover">':ic(nkCatIcon(lb),28);
      h2+='<button class="pcard" data-nk-cat="'+esc(lb)+'">'
        +'<div class="ptile" style="background:'+meta2.color+'22;color:'+meta2.color+'">'+tile+'</div>'
        +'<div class="pbody"><div class="nm">'+esc(smmTranslate(lb))+'</div><div class="ct">'+g2.cats[lb].length+' '+esc(t("nk_svc_count"))+'</div></div></button>';
    }
    return '<button class="backrow" data-nk-back-top="1">'+ic("arrowLeft",16)+' <b>'+esc(meta2.name)+'</b></button>'
      +'<div class="grid groupgrid">'+h2+'</div>';
  }

  // 1-qavat: 4 ta yirik ilova kartochkasi
  var h1='';
  for(var j=0;j<apps.length;j++){
    var aK=apps[j],metaA=NK_APP_META[aK];
    var appImg=catMeta[nkAppKey(aK)]&&catMeta[nkAppKey(aK)].img;
    var aTile=appImg?'<img src="'+esc(appImg)+'" alt="" loading="lazy" style="width:100%;height:100%;object-fit:cover">':ic(metaA.icon,34);
    h1+='<button class="pcard" data-nk-app="'+aK+'">'
      +'<div class="ptile" style="background:'+metaA.color+';color:#fff;overflow:hidden">'+aTile+'</div>'
      +'<div class="pbody"><div class="nm">'+esc(metaA.name)+'</div><div class="ct">'+byApp[aK].length+' '+esc(t("nk_svc_count"))+'</div></div></button>';
  }
  return backTop+esc(t("nakrutka_title"))+'</b></button><div class="grid groupgrid">'+h1+'</div>';
}
// Xizmatlar ro'yxati hali yuklanmagan bo'lsa jim tarzda yuklab, tayyor bo'lgach
// (agar foydalanuvchi hali ham shu sahifada bo'lsa) qayta chizadi.
var _nkPageLoading=false;
function ensureNkPageLoaded(){
  if(_nkPageLoading)return;
  _nkPageLoading=true;
  loadNkFlat().then(function(){
    _nkPageLoading=false;
    if(S.category==="nakrutka")render();
  }).catch(function(){
    _nkPageLoading=false;
    if(S.category==="nakrutka")render();
  });
}

function openFavoritesSheet(){
  var favIds=ME.favorites||[];
  var items=catalog().filter(function(x){return favIds.indexOf(x.id)!==-1&&x.active!==false;});
  var html='<h2>'+esc(t("fav_title"))+'</h2>';
  html+=items.length?productGridHTML(items):('<div class="paynote">'+esc(t("fav_empty"))+'</div>');
  html+='<div style="height:16px"></div>';
  var sh=openSheet(html);
  var opens=sh.querySelectorAll("[data-open]");
  for(var i=0;i<opens.length;i++)opens[i].addEventListener("click",function(){
    var id=this.getAttribute("data-open");closeSheet();openProduct(id);
  });
  var favs=sh.querySelectorAll("[data-fav]");
  for(var j=0;j<favs.length;j++)favs[j].addEventListener("click",function(e){
    e.stopPropagation();
    var id=this.getAttribute("data-fav");toggleFavorite(id);
    // sheetni yangilaymiz (element sevimlilardan olib tashlangan bo'lishi mumkin)
    closeSheet();openFavoritesSheet();
  });
}

    +'<label>Bitta foydalanuvchiga limiti</label><input id="pmPerUser" type="number" min="0" value="1">'
    +'<label>Min. buyurtma summasi (0 = shartsiz)</label><input id="pmMin" type="number" min="0" value="0">'
    +'<label>Izoh (ixtiyoriy)</label><input id="pmNote" placeholder="Masalan: yangi mijozlar uchun">'
    +'<div style="height:10px"></div><button class="btn" id="pmCreateBtn">Yaratish</button>'
    +'<div class="sect" style="margin:18px 0 8px">Mavjud promo-kodlar</div>'
    +'<div id="pmList">…</div>'
    +'<div style="height:20px"></div>';
  var sh=openSheet(html,openAdmin);
  var typeVal="percent";
  var tbtns=sh.querySelectorAll("#pmType button");
  for(var i=0;i<tbtns.length;i++)tbtns[i].addEventListener("click",function(){
    for(var j=0;j<tbtns.length;j++)tbtns[j].classList.toggle("on",tbtns[j]===this);
    typeVal=this.getAttribute("data-v");
  });
  function fmtExpiry(p){
    var bits=[];
    bits.push((p.usedCount||0)+"/"+(p.maxUses?p.maxUses:"∞")+" ishlatilgan");
    if(p.minOrder)bits.push("min "+money(p.minOrder));
    if(p.expiresAt)bits.push("muddati: "+new Date(p.expiresAt).toLocaleDateString());
    return bits.join(" · ");
  }
  function loadList(){
    api("/api/admin/promo/list").then(function(r){
      var list=r.promoCodes||[];
      if(!list.length){sh.querySelector("#pmList").innerHTML='<div class="d">Hozircha promo-kod yo\'q.</div>';return;}
      sh.querySelector("#pmList").innerHTML=list.map(function(p){
        var val=p.type==="percent"?(p.value+"%"):money(p.value);
        return '<div class="card" style="padding:10px 12px;margin-bottom:8px">'
          +'<div style="display:flex;justify-content:space-between;align-items:center">'
          +'<b style="font-family:monospace">'+esc(p.code)+'</b><span style="color:'+(p.active?"var(--acc)":"var(--mut)")+'">'+(p.active?"faol":"o\'chirilgan")+'</span>'
          +'</div>'
          +'<div class="d" style="margin:4px 0">'+esc(val)+' chegirma · '+esc(fmtExpiry(p))+(p.note?(" · "+esc(p.note)):"")+'</div>'
          +'<div style="display:flex;gap:8px;margin-top:6px">'
          +'<button class="btn sm gray" data-toggle="'+esc(p.code)+'">'+(p.active?"O\'chirish":"Yoqish")+'</button>'
          +'<button class="btn sm red" data-del="'+esc(p.code)+'">O\'chirib tashlash</button>'
          +'</div></div>';
      }).join("");
      var tb=sh.querySelectorAll("[data-toggle]");
      for(var k=0;k<tb.length;k++)tb[k].addEventListener("click",function(){
        api("/api/admin/promo/toggle","POST",{code:this.getAttribute("data-toggle")}).then(function(){haptic("ok");loadList();});
      });
      var db=sh.querySelectorAll("[data-del]");
      for(var k2=0;k2<db.length;k2++)db[k2].addEventListener("click",function(){
        if(!confirm("Promo-kodni butunlay o\'chirib tashlaysizmi?"))return;
        api("/api/admin/promo/delete","POST",{code:this.getAttribute("data-del")}).then(function(){haptic("ok");loadList();});
      });
    }).catch(function(){});
  }
  loadList();
  sh.querySelector("#pmCreateBtn").addEventListener("click",function(){
    var code=(sh.querySelector("#pmCode").value||"").trim().toUpperCase();
    var value=Number(sh.querySelector("#pmValue").value)||0;
    if(!code||!value){toast("Kod va qiymatni kiriting",true);return;}
    var btn=this;btn.disabled=true;
    api("/api/admin/promo/create","POST",{
      code:code,type:typeVal,value:value,
      maxUses:Number(sh.querySelector("#pmMax").value)||0,
      perUserLimit:Number(sh.querySelector("#pmPerUser").value)||1,
      minOrder:Number(sh.querySelector("#pmMin").value)||0,
      note:sh.querySelector("#pmNote").value||""
    }).then(function(){
      btn.disabled=false;haptic("ok");toast("Promo-kod yaratildi");
      sh.querySelector("#pmCode").value="";sh.querySelector("#pmValue").value="";sh.querySelector("#pmNote").value="";
      loadList();
    }).catch(function(){btn.disabled=false;toast("Xatolik",true);});
  });
}

// Rasmni kichraytirib (shaffoflik saqlanadi) serverga yuklaydi → "/gimg/..." manzil.
function gUploadImage(file,maxSide,cb){
  try{
    var rd=new FileReader();
    rd.onload=function(){
      var im=new Image();
      im.onload=function(){
        var w=im.width,h=im.height,k=Math.min(1,maxSide/Math.max(w,h));
        w=Math.round(w*k);h=Math.round(h*k);
        var cv=document.createElement("canvas");cv.width=w;cv.height=h;
        cv.getContext("2d").drawImage(im,0,0,w,h);
        var url=cv.toDataURL("image/webp",0.9);
        if(url.indexOf("data:image/webp")!==0)url=cv.toDataURL("image/png");
        api("/api/admin/games/image","POST",{dataUrl:url}).then(function(r){cb(r.url);})
          .catch(function(e){toast((e&&e.resp&&e.resp.error)||"Rasm yuklanmadi",true);});
      };
      im.onerror=function(){toast("Rasm o'qilmadi",true);};
      im.src=rd.result;
    };
    rd.readAsDataURL(file);
  }catch(e){toast("Rasm xatosi",true);}
}

/* ===== admin: saytdan import =====
   1-qadam: saytdagi o'yinlar → 2-qadam: paketlarni belgilash, qaysi o'yinga, kurs va ustama. */
function openAdminImport(lineId){
  var line=GADM.lines.filter(function(x){return x.id===lineId;})[0];if(!line)return;
  var sh=openSheet('<h2>'+esc(line.name)+' — import</h2><div id="imBody"><div class="paynote">⏳ Saytdan o\'yinlar olinmoqda…</div></div>',function(){openAdminLineForm(lineId);});
  var body=sh.querySelector("#imBody");
  api("/api/admin/games/catalog","POST",{lineId:lineId}).then(function(r){
    var h='<div class="paynote" style="margin:0 0 10px">O\'yinni tanlang. Ro\'yxatda bo\'lmasa — saytdagi kodini yozing.</div>'
      +'<div class="arow"><input id="imCode" placeholder="kod / ID"><button class="btn sm" id="imGo" style="width:auto">Ochish</button></div>'
      +'<input id="imFilter" placeholder="Qidirish…" style="margin:8px 0">'
      +'<div id="imList"></div>';
    body.innerHTML=h;
    function draw(q){
      q=String(q||"").toLowerCase();
      var list=(r.games||[]).filter(function(g){return !q||(g.name+" "+g.code).toLowerCase().indexOf(q)!==-1;}).slice(0,80);
      sh.querySelector("#imList").innerHTML=list.map(function(g){
        return '<button class="card" data-imcode="'+esc(g.code)+'" style="width:100%;margin:0 0 6px;padding:9px 10px;display:flex;align-items:center;gap:10px;text-align:left">'
          +'<div class="gav" style="width:38px;height:38px;font-size:13px;background:var(--card2)">'+(g.img?'<img src="'+esc(g.img)+'" alt="" loading="lazy" referrerpolicy="no-referrer">':esc(gameInitials(g.name)))+'</div>'
          +'<div style="flex:1;min-width:0"><b>'+esc(g.name)+'</b><div class="d">'+esc(g.code)+'</div></div></button>';
      }).join("")||'<div class="paynote">Topilmadi</div>';
      var bs=sh.querySelectorAll("[data-imcode]");
      for(var i=0;i<bs.length;i++)bs[i].addEventListener("click",function(){openAdminImportPkgs(lineId,this.getAttribute("data-imcode"));});
    }
    draw("");
    sh.querySelector("#imFilter").addEventListener("input",function(){draw(this.value);});
    sh.querySelector("#imGo").addEventListener("click",function(){var c=sh.querySelector("#imCode").value.trim();if(c)openAdminImportPkgs(lineId,c);});
  }).catch(function(e){body.innerHTML='<div class="paynote" style="color:var(--err)">❌ '+esc((e&&e.resp&&e.resp.error)||t("srv_off"))+'</div>'
    +'<div class="d">Kalitlarni tekshiring (liniya formasida «Sinash»).</div>';});
}

  api("/api/admin/games/catalog","POST",{lineId:lineId,code:code}).then(function(r){
    var pk=r.pkg,rate=r.rate||"",markup=r.markup||"";
    var norm=function(x){return String(x||"").toLowerCase().replace(/[^a-z0-9]/g,"");};
    var guess=GADM.games.filter(function(g){return norm(g.name)===norm(pk.name)||norm(pk.name).indexOf(norm(g.name))===0;})[0];
    var h='<div class="card" style="margin:0 0 10px;padding:10px;display:flex;align-items:center;gap:10px">'
      +'<div class="gav" style="width:46px;height:46px;background:var(--card2)">'+(pk.img?'<img src="'+esc(pk.img)+'" alt="" referrerpolicy="no-referrer">':esc(gameInitials(pk.name||code)))+'</div>'

/* ---------- Moliya grafiklari ---------- */
function vizShort(n){n=Number(n)||0;var a=Math.abs(n);
  if(a>=1e9)return (n/1e9).toFixed(a>=1e10?0:1).replace(/\.0$/,"")+" mlrd";
  if(a>=1e6)return (n/1e6).toFixed(a>=1e7?0:1).replace(/\.0$/,"")+" mln";
  if(a>=1e3)return Math.round(n/1e3)+" ming";return String(Math.round(n));}
function vizDay(d){var p=String(d).split("-");return p[2]+"."+p[1];}
// Ikki seriya (kirim, sotuv) — bir xil birlik (so'm), shuning uchun bitta o'q.
function vizDailyHTML(daily){
  if(!daily||!daily.length)return "";
  return '<div class="viz viz-card" id="vizDaily"><div class="viz-head"><div class="viz-title">Kunlik kirim va sotuv · '+daily.length+' kun</div>'
    +'<button class="viz-tbtn" id="vizTblBtn">Jadval</button></div>'
    +'<div class="viz-leg"><span><i style="background:var(--s1)"></i>Kirim</span><span><i style="background:var(--s2)"></i>Sotuv</span></div>'
    +'<div id="vizPlot"></div><div class="viz-tip" id="vizTip"></div><div id="vizTbl" hidden></div></div>';
}
function vizBindDaily(root,daily){
  var box=root.querySelector("#vizDaily");if(!box)return;
  var W=340,H=170,L=56,R=8,T=10,B=22,n=daily.length;
  var max=0;daily.forEach(function(x){max=Math.max(max,x.topup,x.sales);});
  // "Chiroyli" yuqori chegara: 1/2/5 × 10^k
  var step=Math.pow(10,Math.floor(Math.log10(Math.max(max,1)/3))),nice=[1,2,5,10].map(function(k){return k*step;}).filter(function(v){return v*3>=max;})[0]||step*10;
  var ymax=nice*3;
  var x=function(i){return L+(n<2?0:(i*(W-L-R)/(n-1)));},y=function(v){return T+(H-T-B)*(1-v/ymax);};
  var path=function(k){return daily.map(function(d,i){return (i?"L":"M")+x(i).toFixed(1)+" "+y(d[k]).toFixed(1);}).join("");};
  var g='';
  for(var j=0;j<=3;j++){var v=nice*j,yy=y(v).toFixed(1);
    g+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+yy+'" y2="'+yy+'" stroke="var(--grid)" stroke-width="1"/>'
      +'<text x="'+(L-6)+'" y="'+yy+'" dy="3.5" text-anchor="end" font-size="9.5" fill="var(--axis)">'+vizShort(v)+'</text>';}
  [0,Math.floor((n-1)/2),n-1].forEach(function(i){
    g+='<text x="'+x(i).toFixed(1)+'" y="'+(H-6)+'" text-anchor="'+(i===0?"start":i===n-1?"end":"middle")+'" font-size="9.5" fill="var(--axis)">'+vizDay(daily[i].d)+'</text>';});
  var svg='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Kunlik kirim va sotuv">'+g
    +'<path d="'+path("topup")+'" fill="none" stroke="var(--s1)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>'
    +'<path d="'+path("sales")+'" fill="none" stroke="var(--s2)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>'
    +'<g id="vizHov" style="display:none"><line id="vizX" y1="'+T+'" y2="'+(H-B)+'" stroke="var(--axis)" stroke-width="1" stroke-dasharray="3 3"/>'
    +'<circle id="vizD1" r="4.5" fill="var(--s1)" stroke="var(--card)" stroke-width="2"/><circle id="vizD2" r="4.5" fill="var(--s2)" stroke="var(--card)" stroke-width="2"/></g>'
    +'<rect x="'+L+'" y="0" width="'+(W-L-R)+'" height="'+H+'" fill="transparent" id="vizHit"/></svg>';
  box.querySelector("#vizPlot").innerHTML=svg;
  var el=box.querySelector("svg"),hov=box.querySelector("#vizHov"),tip=box.querySelector("#vizTip");
  function show(ev){
    var r=el.getBoundingClientRect(),px=(ev.clientX-r.left)*W/r.width;
    var i=Math.max(0,Math.min(n-1,Math.round((px-L)/((W-L-R)/Math.max(1,n-1)))));
    var d=daily[i],xx=x(i);
    hov.style.display="";box.querySelector("#vizX").setAttribute("x1",xx);box.querySelector("#vizX").setAttribute("x2",xx);
    var c1=box.querySelector("#vizD1"),c2=box.querySelector("#vizD2");
    c1.setAttribute("cx",xx);c1.setAttribute("cy",y(d.topup));c2.setAttribute("cx",xx);c2.setAttribute("cy",y(d.sales));
    tip.innerHTML='<b>'+vizDay(d.d)+'</b><br><i style="background:var(--s1)"></i>Kirim: <b>'+esc(money(d.topup))+'</b><br><i style="background:var(--s2)"></i>Sotuv: <b>'+esc(money(d.sales))+'</b>';
    tip.style.display="block";
    var br=box.getBoundingClientRect(),left=ev.clientX-br.left+12;
    if(left+tip.offsetWidth>br.width-4)left=ev.clientX-br.left-tip.offsetWidth-12;
    tip.style.left=Math.max(4,left)+"px";tip.style.top=(r.top-br.top+6)+"px";
  }
  function hide(){hov.style.display="none";tip.style.display="none";}
  el.addEventListener("pointermove",show);el.addEventListener("pointerdown",show);el.addEventListener("pointerleave",hide);
  // Jadval ko'rinishi (rangsiz, ekran o'quvchi va aniq raqamlar uchun)
  box.querySelector("#vizTblBtn").addEventListener("click",function(){
    var tb=box.querySelector("#vizTbl"),pl=box.querySelector("#vizPlot");
    if(tb.hidden){tb.innerHTML='<table class="viz-table"><tr><th>Kun</th><th>Kirim</th><th>Sotuv</th></tr>'
      +daily.slice().reverse().map(function(d){return '<tr><td>'+vizDay(d.d)+'</td><td>'+esc(money(d.topup))+'</td><td>'+esc(money(d.sales))+'</td></tr>';}).join("")+'</table>';
      tb.hidden=false;pl.hidden=true;this.textContent="Grafik";}
    else{tb.hidden=true;pl.hidden=false;this.textContent="Jadval";}
    hide();
  });
}
// Bo'limlar bo'yicha sotuv — bitta rang, gorizontal ustunlar, qiymat yozuvi matn rangida.
function vizBarsHTML(title,rows){

}

function supPoll(){

// Oxirgi 30 kunlik savdo uchun oddiy SVG grafik (chiziq + fon ustunlar) — tashqi kutubxonasiz.
function dashChartSVG(daily){
  daily=daily||[];
  if(!daily.length)return '<div class="paynote">'+esc(t("a_dash_no_top"))+'</div>';
  var W=320,H=120,PAD=8;
  var max=daily.reduce(function(m,d){return Math.max(m,d.total);},0)||1;
  var stepX=(W-PAD*2)/Math.max(1,daily.length-1);
  var pts=daily.map(function(d,i){
    var x=PAD+i*stepX;
    var y=H-PAD-(d.total/max)*(H-PAD*2);
    return x.toFixed(1)+","+y.toFixed(1);
  }).join(" ");
  var barsW=(W-PAD*2)/daily.length;
  var bars=daily.map(function(d,i){
    var bh=(d.total/max)*(H-PAD*2);
    var x=PAD+i*barsW;
    var y=H-PAD-bh;
    return '<rect x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+(barsW*0.6).toFixed(1)+'" height="'+bh.toFixed(1)+'" rx="1.5" fill="currentColor" opacity="0.18"></rect>';
  }).join("");
  var first=esc(daily[0].date.slice(5)), last=esc(daily[daily.length-1].date.slice(5));
  return '<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:130px;color:var(--accent,#7fb2ff)">'
    +bars
    +'<polyline points="'+pts+'" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"></polyline>'
    +'</svg>'
    +'<div style="display:flex;justify-content:space-between;font-size:11px;opacity:.6;margin-top:2px"><span>'+first+'</span><span>'+last+'</span></div>';
}

  var ALL=PAY_SLOTS.concat(PROFILE_SLOTS);
  function rowHTML(s){
    var cur=UiEmoji[s.key];
    var id=safeId(s.key);
    return '<div class="card" style="padding:10px 12px;margin-bottom:8px">'
      +'<div style="display:flex;align-items:center;gap:10px;margin-bottom:8px">'
      +'<div class="ibadge" id="uiprev_'+id+'" style="background:var(--card2)">'+(cur?slotEmojiHTML(s.key,"—"):"—")+'</div>'
      +'<div style="font-weight:700;font-size:13.5px;flex:1">'+esc(s.label)+'</div>'
      +'<button class="btn sm red'+(cur?"":" hide")+'" id="uiclear_'+id+'" type="button">Tozalash</button>'
      +'</div>'
      +'<div class="arow"><input id="uiid_'+id+'" style="flex:1" placeholder="5433838489083409183" inputmode="numeric">'
      +'<button class="btn sm" id="uifetch_'+id+'" type="button">Yuklab olish</button></div>'
      +'<div class="minnote" id="uistatus_'+id+'">'+(cur?"✅ O'rnatilgan":"")+'</div>'
      +'</div>';
  }
  var html='<h2>Premium emoji (to\'lov / profil)</h2>'
    +'<div class="paynote" style="margin-top:0">Telegram Desktop\'da istalgan premium emojini ustiga bosib "Copy Emoji ID" orqali ID oling, shu yerga qo\'ying va "Yuklab olish"ni bosing — har bir to\'lov usuli va profil tugmasi uchun alohida-alohida emoji o\'rnatishingiz mumkin.</div>'
    +'<div class="sect" style="margin:14px 0 6px">To\'lov usullari</div>'
    +PAY_SLOTS.map(rowHTML).join("")
    +'<div class="sect" style="margin:14px 0 6px">Profil tugmalari</div>'
    +PROFILE_SLOTS.map(rowHTML).join("")
    +'<div style="height:20px"></div>';
  var sh=openSheet(html,openAdmin);
  ALL.forEach(function(s){
    var id=safeId(s.key);
    var idw=sh.querySelector("#uiid_"+id);
    var statusEl=sh.querySelector("#uistatus_"+id);
    var prevEl=sh.querySelector("#uiprev_"+id);
    var fetchBtn=sh.querySelector("#uifetch_"+id);
    var clearBtn=sh.querySelector("#uiclear_"+id);
    if(fetchBtn)fetchBtn.addEventListener("click",function(){
      var eid=idw?idw.value.trim():"";
      if(!/^\d+$/.test(eid)){toast("ID noto'g'ri — faqat raqamlardan iborat bo'lishi kerak");return;}
      fetchBtn.disabled=true;fetchBtn.textContent="Yuklanmoqda...";
      if(statusEl)statusEl.textContent="Telegramdan olinmoqda...";
      api("/api/admin/premium-emoji?id="+encodeURIComponent(eid),"GET").then(function(r){
        var val={id:eid};
        val.kind=r.kind;val.url=r.url;
        var out=Object.assign({},UiEmoji);
        out[s.key]=val;
        return api("/api/admin/ui-emoji","POST",out).then(function(){
          UiEmoji=out;
          if(prevEl)prevEl.innerHTML=slotEmojiHTML(s.key,"—");
          if(statusEl)statusEl.textContent="✅ Saqlandi";
          if(clearBtn)clearBtn.classList.remove("hide");
          toast("Premium emoji saqlandi");haptic("ok");
          fetchBtn.disabled=false;fetchBtn.textContent="Yuklab olish";
        });
      }).catch(function(e){
        var code=e&&e.resp&&e.resp.error;
        var msg=code==="emoji_not_found"?"Bunday ID topilmadi — ID to'g'riligini tekshiring"
          :code==="tgs_decode_failed"?"Animatsiya faylini o'qib bo'lmadi, qayta urinib ko'ring"
          :code==="not admin"?"Ruxsat yo'q":"Xatolik yuz berdi, qayta urinib ko'ring";
        if(statusEl)statusEl.textContent="⚠️ "+msg;
        toast(msg,true);
        fetchBtn.disabled=false;fetchBtn.textContent="Yuklab olish";
      });
    });
    if(clearBtn)clearBtn.addEventListener("click",function(){
      var out=Object.assign({},UiEmoji);
      delete out[s.key];
      clearBtn.disabled=true;
      api("/api/admin/ui-emoji","POST",out).then(function(){
        UiEmoji=out;
        if(prevEl)prevEl.innerHTML="—";
        if(statusEl)statusEl.textContent="";
        clearBtn.classList.add("hide");clearBtn.disabled=false;
        toast("Tozalandi");haptic("ok");
      }).catch(function(){toast(t("srv_off"),true);clearBtn.disabled=false;});
    });
  });
}
/* ===== admin: SMM panel (nakrutka liniyasi) formasi ===== */
function openAdminSmmLineForm(id){
  api("/api/admin/smm/lines").then(function(r){
    var l=id?r.lines.filter(function(x){return x.id===id;})[0]:null;
    var F=l||{id:"",name:"",url:"",enabled:false,priority:60,usdRate:0,markup:"",show:true,keySet:false};
    var html='<h2>'+(l?esc(l.name):"Yangi SMM panel")+'</h2>'
      +'<div class="d" style="margin:0 0 8px">Ko\'pchilik SMM panellar bir xil API ishlatadi (JAP, Peakerr, SMMKings, SocPanel…). Panel saytida <b>API</b> bo\'limidan URL va kalitni oling.</div>'
      +'<label>Nomi</label><input id="sl_name" value="'+esc(F.name)+'" placeholder="Masalan: Peakerr">'
      +'<label>API URL</label><input id="sl_url" value="'+esc(F.url)+'" inputmode="url" autocapitalize="off" spellcheck="false" placeholder="https://panel.com/api/v2">'
      +'<label>API kalit</label><input id="sl_key" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="'+(F.keyFromEnv?"Railway'dagi JAP_API_KEY ishlatilmoqda":(F.keySet?"•••••• (o\'rnatilgan — almashtirish uchun yangisini yozing)":"kalit"))+'">'
      +'<div class="arow"><div style="flex:1"><label>Ustuvorlik</label><input id="sl_pr" type="number" value="'+(F.priority||0)+'"></div>'
      +'<div style="flex:1"><label>Kurs, so\'m ($1)</label><input id="sl_rate" type="number" value="'+(F.usdRate||"")+'" placeholder="umumiy ('+r.usdRate+')"></div>'
      +'<div style="flex:1"><label>Ustama, %</label><input id="sl_mk" type="number" value="'+(F.markup===""?"":F.markup)+'" placeholder="umumiy ('+r.markup+')"></div></div>'
      +'<div class="switch"><span style="font-size:13.5px">Xizmatlari mijozlarga ko\'rinsin</span><button class="swbtn'+(F.show!==false?" on":"")+'" id="sl_show"><i></i></button></div>'
      +'<div class="d" style="margin:-6px 0 6px">O\'chirsangiz — panel faqat zaxira sifatida ishlaydi.</div>'
      +'<div class="switch"><span style="font-size:13.5px">Yoqilgan</span><button class="swbtn'+(F.enabled?" on":"")+'" id="sl_on"><i></i></button></div>'
      +'<div class="arow" style="margin-top:8px"><button class="btn" id="slSave">'+esc(t("a_save"))+'</button><button class="btn gray" id="slTest">Sinash</button></div>'
      +'<div class="d" id="slRes" style="margin:8px 0 0"></div>'
      +(l&&!/^(jap|peakerr|smmkings|smm4|smm5)$/.test(l.id)?'<div style="height:8px"></div><button class="btn red" id="slDel">O\'chirish</button>':'')
      +'<div style="height:20px"></div>';
    var sh=openSheet(html,openAdminNakrutka);
    ["#sl_show","#sl_on"].forEach(function(x){sh.querySelector(x).addEventListener("click",function(){this.classList.toggle("on");});});
    function body(){
      var b={id:F.id,name:sh.querySelector("#sl_name").value.trim(),url:sh.querySelector("#sl_url").value.trim(),
        priority:Number(sh.querySelector("#sl_pr").value)||0,usdRate:Number(sh.querySelector("#sl_rate").value)||0,
        markup:sh.querySelector("#sl_mk").value.trim(),show:sh.querySelector("#sl_show").classList.contains("on"),
        enabled:sh.querySelector("#sl_on").classList.contains("on")};
      var k=sh.querySelector("#sl_key").value.trim();if(k)b.key=k;
      return b;
    }
    function save(then){
      return api("/api/admin/smm/line","POST",body()).then(function(x){
        F.id=x.line.id;sh.querySelector("#sl_key").value="";
        if(x.note){sh.querySelector("#sl_on").classList.remove("on");toast(x.note,true);}else{haptic("ok");toast(t("a_saved"));}
        if(then)then(x);
      }).catch(function(e){toast((e&&e.resp&&e.resp.error)||t("srv_off"),true);});
    }
    sh.querySelector("#slSave").addEventListener("click",function(){save(function(){openAdminNakrutka();});});
    sh.querySelector("#slTest").addEventListener("click",function(){
      var res=sh.querySelector("#slRes");res.textContent="Tekshirilmoqda…";
      save(function(){api("/api/admin/smm/line-test","POST",{id:F.id}).then(function(x){res.textContent=(x.ok?"✅ ":"❌ ")+x.message;})
        .catch(function(){res.textContent="Xatolik";});});
    });
    var d=sh.querySelector("#slDel");
    if(d)d.addEventListener("click",function(){
      if(!confirm(F.name+" o'chirilsinmi?"))return;
      api("/api/admin/smm/line-delete","POST",{id:F.id}).then(function(){toast("O'chirildi");openAdminNakrutka();})
        .catch(function(e){toast((e&&e.resp&&e.resp.error)||t("srv_off"),true);});
    });
  }).catch(function(){toast(t("srv_off"),true);});
}

// Xizmatlarni ko'rish/qidirish/yashirish — JAP'dan kelgan HAMMA xizmat shu yerda,
// yashirilganlari mijozlarga "/api/nakrutka/services"da ko'rinmaydi.
function openAdminNakrutkaServices(){
  var html='<h2>'+esc(t("a_nk_services"))+'</h2>'
    +'<input id="nkSvcSearch" placeholder="'+esc(t("a_nk_search_ph"))+'">'
    +'<div id="nkSvcList" style="margin-top:10px;color:var(--mut);font-size:13px">'+esc(t("nakrutka_loading"))+'</div>'
    +'<div style="height:20px"></div>';
  var sh=openSheet(html,openAdminNakrutka);
  var allServices=[],hiddenIds=[],backups={};
  function render(filterText){
    var f=(filterText||"").trim().toLowerCase();
    var list=!f?allServices.slice(0,60):allServices.filter(function(s){
      return (s.name||"").toLowerCase().indexOf(f)!==-1||(s.category||"").toLowerCase().indexOf(f)!==-1;
    }).slice(0,60);
    var h='';
    for(var i=0;i<list.length;i++){
      var s=list[i],isHidden=hiddenIds.some(function(h){return String(h)===String(s.service);});
      h+='<div class="row"><div class="l" style="min-width:0;flex:1">'+esc(s.name)
        +(isHidden?' <span class="badge cncl" style="margin-left:4px">'+esc(t("a_nk_hidden_badge"))+'</span>':'')
        +'<div class="d">'+(s.lineName?'🔌 '+esc(s.lineName)+' · ID '+esc(String(s.service))+' · ':'')+esc(s.category||"")+' · min '+s.min+' · max '+s.max+' · $'+Number(s.rate).toFixed(2)+'/1000'
        +(backups[String(s.service)]?' · ↪️ zaxira: '+esc(backups[String(s.service)]):'')+'</div></div>'
        +'<button class="btn sm gray" data-nkbk="'+esc(String(s.service))+'" style="width:auto">↪️</button>'
        +'<button class="btn sm '+(isHidden?"":"gray")+'" data-nksvc-toggle="'+esc(String(s.service))+'">'+esc(isHidden?t("a_nk_unhide"):t("a_nk_hide"))+'</button></div>';
    }
    sh.querySelector("#nkSvcList").innerHTML=h||('<div class="paynote">'+esc(t("empty_section"))+'</div>');
    var bks=sh.querySelectorAll("[data-nkbk]");
    for(var k=0;k<bks.length;k++)bks[k].addEventListener("click",function(){
      var key=this.getAttribute("data-nkbk");
      var v=prompt("Zaxira xizmat: asosiy panel rad etsa shu ishlatiladi.\nMasalan: peakerr:1234 (boshqa panel) yoki 5678 (JAP ID).\nBo'sh qoldirsangiz — zaxira o'chiriladi.",backups[key]||"");
      if(v===null)return;
      api("/api/admin/smm/backup","POST",{key:key,backup:v.trim()}).then(function(r){backups=r.backups||{};haptic("ok");toast(v.trim()?"Zaxira saqlandi":"Zaxira o'chirildi");render(sh.querySelector("#nkSvcSearch").value);})
        .catch(function(e){toast((e&&e.resp&&e.resp.error)||t("srv_off"),true);});
    });
    var btns=sh.querySelectorAll("[data-nksvc-toggle]");
    for(var b=0;b<btns.length;b++)btns[b].addEventListener("click",function(){
      var raw=this.getAttribute("data-nksvc-toggle"),id=/^\d+$/.test(raw)?Number(raw):raw,btn=this;btn.disabled=true;
      api("/api/admin/nakrutka/toggle-service","POST",{service:id}).then(function(r){
        hiddenIds=r.hidden||[];haptic("ok");render(sh.querySelector("#nkSvcSearch").value);
      }).catch(function(){toast(t("srv_off"),true);btn.disabled=false;});
    });
  }
  api("/api/admin/nakrutka/services").then(function(r){
    allServices=r.services||[];hiddenIds=r.hidden||[];backups=r.backups||{};
    render("");
  }).catch(function(){sh.querySelector("#nkSvcList").innerHTML='<div class="paynote">'+esc(t("nakrutka_load_err"))+'</div>';});
  sh.querySelector("#nkSvcSearch").addEventListener("input",function(){render(this.value);});
}
// Admin har bir SMM guruhiga (masalan Telegram -> Members, Instagram -> Likes) ixtiyoriy
// rasm biriktiradi. Guruh kaliti — "app::xom_kategoriya_nomi" (inglizcha, til-mustaqil),
// shu bilan mijoz ekranidagi (openNakrutkaPanel -> showCategories) kalit mos keladi.
// Rasm tanlanganda darhol 300x300gacha siqiladi (canvas) va Base64 sifatida saqlanadi.
function openAdminNakrutkaImages(){
  var html='<h2>'+esc(t("a_nk_images"))+'</h2><div class="paynote" style="margin-top:0">'+esc(t("a_nk_images_hint"))+'</div>'
    // Bosh sahifadagi "Nakrutka" kartochkasining o'zi (rasm + yoqilgan/o'chirilgan) —
    // shu yerdan ham tahrirlanadi, alohida umumiy "Kategoriyalar" ekraniga kirish shart emas.
    +'<div class="sect" style="margin:16px 0 6px">'+esc(t("a_nk_card_title"))+'</div>'
    +'<div id="nkCardBox" class="card"></div>'
    +'<div class="sect" style="margin:16px 0 6px">'+esc(t("a_nk_apps_title"))+'</div>'
    +'<div class="paynote" style="margin-top:0">'+esc(t("a_nk_apps_hint"))+'</div>'
    +'<div id="nkAppList" style="margin-top:8px"></div>'
    +'<div class="sect" style="margin:16px 0 6px">'+esc(t("a_nk_groups_title"))+'</div>'
    +'<div id="nkImgList" style="margin-top:2px;color:var(--mut);font-size:13px">'+esc(t("nakrutka_loading"))+'</div>'
    +'<div style="height:8px"></div><button class="btn big" id="nkImgSaveBtn" style="display:none">'+esc(t("a_save"))+'</button>'
    +'<div style="height:20px"></div>';
  var sh=openSheet(html,openAdminNakrutka);
  var groups=[],curMeta={},pendingImg={},pendingCardImg=null;

  // ---- Nakrutka bosh kartochkasi (rasm + yoqilgan holati) ----
  function cardBoxHTML(){
    var meta=CatMeta.nakrutka||{};
    var img=(pendingCardImg==="__clear__")?"":(pendingCardImg||meta.img||"");
    var thumb=img?'<img src="'+esc(img)+'" alt="" style="width:100%;height:100%;object-fit:cover">':ic("trendUp",18);
    var enabled=meta.enabled!==false;
    return '<div style="display:flex;align-items:center;gap:10px">'
      +'<div class="ibadge" style="background:#22304a;color:#fff;width:44px;height:44px;overflow:hidden">'+thumb+'</div>'
      +'<div style="flex:1;min-width:0"><div style="font-size:13px;font-weight:650">'+esc((meta.label&&meta.label[S.lang])?meta.label[S.lang]:t("tab_nakrutka"))+'</div>'
      +'<div class="d" style="font-size:11px;color:var(--mut)">'+esc(t("a_nk_card_hint"))+'</div></div>'
      +'<label class="btn sm gray" style="cursor:pointer;margin:0">'+ic("camera",13)+' <input type="file" accept="image/jpeg,image/png,image/webp" id="nkCardFile" style="display:none"></label>'
      +(img?'<button class="btn sm red" id="nkCardClear" type="button">'+ic("trash",12)+'</button>':'')
      +'</div>'
      +'<div class="switch" style="margin-top:10px"><span style="font-size:13.5px">'+esc(t("a_cat_enabled"))+'</span><button class="swbtn'+(enabled?" on":"")+'" id="nkCardSw"><i></i></button></div>';
  }
  function renderCardBox(){
    var box=sh.querySelector("#nkCardBox");
    box.innerHTML=cardBoxHTML();
    box.querySelector("#nkCardFile").addEventListener("change",function(){
      var file=this.files&&this.files[0];if(!file)return;
      var rd=new FileReader();
      rd.onload=function(){
        var im=new Image();
        im.onload=function(){
          try{
            var MAX=400,w=im.width,h=im.height;
            if(w>MAX){h=Math.round(h*MAX/w);w=MAX;}
            if(h>MAX){w=Math.round(w*MAX/h);h=MAX;}
            var cv=document.createElement("canvas");cv.width=w;cv.height=h;
            cv.getContext("2d").drawImage(im,0,0,w,h);
            pendingCardImg=cv.toDataURL("image/jpeg",0.85);
            persistCardImg();
          }catch(e){toast(t("srv_off"),true);}
        };
        im.src=rd.result;
      };
      rd.readAsDataURL(file);
    });
    var clr=box.querySelector("#nkCardClear");
    if(clr)clr.addEventListener("click",function(){pendingCardImg="__clear__";persistCardImg();});
    box.querySelector("#nkCardSw").addEventListener("click",function(){
      var btn=this,meta=CatMeta.nakrutka||{},next=!(meta.enabled!==false);
      var out=Object.assign({},CatMeta);
      out.nakrutka=Object.assign({},meta,{enabled:next});
      btn.disabled=true;
      api("/api/admin/category-meta","POST",out).then(function(){
        CatMeta=out;btn.disabled=false;renderCardBox();haptic("ok");toast(next?t("a_cat_unfrozen"):t("a_cat_frozen"));
      }).catch(function(){toast(t("srv_off"),true);btn.disabled=false;});
    });
  }
  // Rasm tanlangan zahoti saqlaydi (bu yerda alohida "Saqlash" tugmasi yo'q — kartochka
  // rasm/holatini kutish shart emas, guruh rasmlari esa pastdagi umumiy tugma bilan saqlanadi).
  function persistCardImg(){
    var meta=CatMeta.nakrutka||{};
    var out=Object.assign({},CatMeta);
    var img=(pendingCardImg==="__clear__")?"":pendingCardImg;
    out.nakrutka=Object.assign({},meta,{img:img});
    api("/api/admin/category-meta","POST",out).then(function(){
      CatMeta=out;pendingCardImg=null;renderCardBox();haptic("ok");toast(t("a_saved"));
    }).catch(function(){toast(t("srv_off"),true);});
  }
  renderCardBox();

  // ---- Butun tarmoqni (Telegram/Instagram/TikTok/YouTube) yashirish/qaytarish + rasm ----
  function appRowHTML(appKey){
    var meta=NK_APP_META[appKey],key=nkAppKey(appKey),hidden=nkIsHidden(curMeta,key);
    var cur=curMeta[key]||{};
    var img=cur.img||"";
    var thumb=img?'<img src="'+esc(img)+'" alt="" style="width:100%;height:100%;object-fit:cover">':ic(meta.icon,18);
    return '<div class="card" style="display:flex;align-items:center;gap:10px;padding:9px 12px;margin-bottom:8px">'
      +'<div class="ibadge" style="background:'+meta.color+'22;color:'+meta.color+';width:38px;height:38px;overflow:hidden">'+thumb+'</div>'
      +'<div style="flex:1;min-width:0"><div style="font-size:13.5px;font-weight:700">'+esc(meta.name)+'</div>'
      +(hidden?'<div class="d" style="font-size:11px;color:var(--err)">'+esc(t("a_nk_hidden_badge"))+'</div>':'')+'</div>'
      +'<button class="btn sm '+(hidden?"":"gray")+'" data-nkapp-toggle="'+appKey+'">'+esc(hidden?t("a_nk_unhide"):t("a_nk_hide"))+'</button>'
      +'<label class="btn sm gray" style="cursor:pointer;margin:0">'+ic("camera",13)+' <input type="file" accept="image/jpeg,image/png,image/webp" data-nkappimg-file="'+esc(appKey)+'" style="display:none"></label>'
      +(img?'<button class="btn sm red" data-nkappimg-clear="'+esc(appKey)+'" type="button">'+ic("trash",12)+'</button>':'')
      +'</div>';
  }
  function renderApps(){
    var h='';
    for(var i=0;i<NK_APP_ORDER.length;i++)h+=appRowHTML(NK_APP_ORDER[i]);
    sh.querySelector("#nkAppList").innerHTML=h;
    var abtns=sh.querySelectorAll("[data-nkapp-toggle]");
    for(var a=0;a<abtns.length;a++)abtns[a].addEventListener("click",function(){
      var appKey=this.getAttribute("data-nkapp-toggle"),btn=this;
      var key=nkAppKey(appKey),hidden=nkIsHidden(curMeta,key);
      var out=Object.assign({},curMeta);
      out[key]=Object.assign({},out[key]||{},{hidden:!hidden});
      btn.disabled=true;
      api("/api/admin/nakrutka/catmeta","POST",out).then(function(){
        curMeta=out;NkCache.catMeta=out;haptic("ok");toast(t("a_saved"));renderApps();btn.disabled=false;
      }).catch(function(){toast(t("srv_off"),true);btn.disabled=false;});
    });
    var afiles=sh.querySelectorAll("[data-nkappimg-file]");
    for(var af=0;af<afiles.length;af++)afiles[af].addEventListener("change",function(){
      var appKey=this.getAttribute("data-nkappimg-file");
      var file=this.files&&this.files[0];if(!file)return;
      var rd=new FileReader();
      rd.onload=function(){
        var im=new Image();
        im.onload=function(){
          try{
            var MAX=300,w=im.width,h=im.height;
            if(w>MAX){h=Math.round(h*MAX/w);w=MAX;}
            if(h>MAX){w=Math.round(w*MAX/h);h=MAX;}
            var cv=document.createElement("canvas");cv.width=w;cv.height=h;
            cv.getContext("2d").drawImage(im,0,0,w,h);
            var dataUrl=cv.toDataURL("image/jpeg",0.85);
            var key=nkAppKey(appKey);
            var out=Object.assign({},curMeta);
            out[key]=Object.assign({},out[key]||{},{img:dataUrl});
            api("/api/admin/nakrutka/catmeta","POST",out).then(function(){
              curMeta=out;NkCache.catMeta=out;haptic("ok");toast(t("a_saved"));renderApps();
            }).catch(function(){toast(t("srv_off"),true);});
          }catch(e){toast(t("srv_off"),true);}
        };
        im.src=rd.result;
      };
      rd.readAsDataURL(file);
    });
    var aclrs=sh.querySelectorAll("[data-nkappimg-clear]");
    for(var ac=0;ac<aclrs.length;ac++)aclrs[ac].addEventListener("click",function(){
      var appKey=this.getAttribute("data-nkappimg-clear"),key=nkAppKey(appKey);
      var out=Object.assign({},curMeta);
      out[key]=Object.assign({},out[key]||{},{img:""});
      api("/api/admin/nakrutka/catmeta","POST",out).then(function(){
        curMeta=out;NkCache.catMeta=out;haptic("ok");toast(t("a_saved"));renderApps();
      }).catch(function(){toast(t("srv_off"),true);});
    });
  }

  function groupRowHTML(g){
    var cur=curMeta[g.key]||{};
    var img=(pendingImg[g.key]==="__clear__")?"":(pendingImg[g.key]||cur.img||"");
    var thumb=img?'<img src="'+esc(img)+'" alt="" style="width:100%;height:100%;object-fit:cover">':ic(nkCatIcon(g.label),18);
    var hidden=nkIsHidden(curMeta,g.key);
    return '<div class="card" style="display:flex;align-items:center;gap:10px;padding:9px 12px" data-nkimg-row="'+esc(g.key)+'">'
      +'<div class="ibadge" style="background:'+g.color+'22;color:'+g.color+';width:40px;height:40px;overflow:hidden">'+thumb+'</div>'
      +'<div style="flex:1;min-width:0"><div style="font-size:13px;font-weight:650">'+esc(g.appName)+' \u2014 '+esc(smmTranslate(g.label))+'</div>'
      +'<div class="d" style="font-size:11px;color:'+(hidden?"var(--err)":"var(--mut)")+'">'+(hidden?esc(t("a_nk_hidden_badge"))+' · ':'')+g.count+' '+esc(t("group_count_unit"))+'</div></div>'
      +'<button class="btn sm '+(hidden?"":"gray")+'" data-nkgrp-toggle="'+esc(g.key)+'">'+esc(hidden?t("a_nk_unhide"):t("a_nk_hide"))+'</button>'
      +'<label class="btn sm gray" style="cursor:pointer;margin:0">'+ic("camera",13)+' <input type="file" accept="image/jpeg,image/png,image/webp" data-nkimg-file="'+esc(g.key)+'" style="display:none"></label>'
      +(img?'<button class="btn sm red" data-nkimg-clear="'+esc(g.key)+'" type="button">'+ic("trash",12)+'</button>':'')
      +'</div>';
  }
  function renderList(){
    var h='';
    for(var i=0;i<groups.length;i++)h+=groupRowHTML(groups[i]);
    sh.querySelector("#nkImgList").innerHTML=h||('<div class="paynote">'+esc(t("empty_section"))+'</div>');
    var fileEls=sh.querySelectorAll("[data-nkimg-file]");
    for(var f=0;f<fileEls.length;f++)fileEls[f].addEventListener("change",function(){
      var key=this.getAttribute("data-nkimg-file");
      var file=this.files&&this.files[0];if(!file)return;
      var rd=new FileReader();
      rd.onload=function(){
        var im=new Image();
        im.onload=function(){
          try{
            var MAX=300,w=im.width,h=im.height;
            if(w>MAX){h=Math.round(h*MAX/w);w=MAX;}
            if(h>MAX){w=Math.round(w*MAX/h);h=MAX;}
            var cv=document.createElement("canvas");cv.width=w;cv.height=h;
            cv.getContext("2d").drawImage(im,0,0,w,h);
            pendingImg[key]=cv.toDataURL("image/jpeg",0.85);
            renderList();toast(t("a_img_selected"));
          }catch(e){toast(t("srv_off"),true);}
        };
        im.src=rd.result;
      };
      rd.readAsDataURL(file);
    });
    var clrEls=sh.querySelectorAll("[data-nkimg-clear]");
    for(var c=0;c<clrEls.length;c++)clrEls[c].addEventListener("click",function(){
      pendingImg[this.getAttribute("data-nkimg-clear")]="__clear__";renderList();
    });
    // Guruhni yashirish/qaytarish — darhol saqlanadi (rasm kabi "Saqlash" tugmasini kutmaydi)
    var gbtns=sh.querySelectorAll("[data-nkgrp-toggle]");
    for(var gi=0;gi<gbtns.length;gi++)gbtns[gi].addEventListener("click",function(){
      var key=this.getAttribute("data-nkgrp-toggle"),btn=this,hidden=nkIsHidden(curMeta,key);
      var out=Object.assign({},curMeta);
      out[key]=Object.assign({},out[key]||{},{hidden:!hidden});
      btn.disabled=true;
      api("/api/admin/nakrutka/catmeta","POST",out).then(function(){
        curMeta=out;NkCache.catMeta=out;haptic("ok");toast(t("a_saved"));renderList();btn.disabled=false;
      }).catch(function(){toast(t("srv_off"),true);btn.disabled=false;});
    });
    var saveBtn=sh.querySelector("#nkImgSaveBtn");
    if(saveBtn)saveBtn.style.display=groups.length?"block":"none";
  }
  api("/api/admin/nakrutka/services").then(function(r){
    var list=r.services||[];
    var byKey={};
    for(var i=0;i<list.length;i++){
      var s=list[i],app=nakrutkaAppOf(s);
      if(NK_APP_ORDER.indexOf(app)===-1)continue; // faqat 4 asosiy tarmoq — boshqalari mijozga ko'rinmaydi
      var appMeta=NK_APP_META[app],rawCat=s.category||"",label=nkCatLabel(rawCat,appMeta.name);
      var key=app+"::"+rawCat;
      if(!byKey[key])byKey[key]={key:key,app:app,appName:appMeta.name,color:appMeta.color,label:label,count:0};
      byKey[key].count++;
    }
    groups=Object.keys(byKey).map(function(k){return byKey[k];})
      .sort(function(a,b){
        var ai=NK_APP_ORDER.indexOf(a.app),bi=NK_APP_ORDER.indexOf(b.app);
        return ai!==bi?ai-bi:a.label.localeCompare(b.label);
      });
    return api("/api/admin/nakrutka/catmeta");
  }).then(function(r){
    curMeta=r||{};
    renderApps();
    renderList();
  }).catch(function(){sh.querySelector("#nkImgList").innerHTML='<div class="paynote">'+esc(t("nakrutka_load_err"))+'</div>';});
  sh.querySelector("#nkImgSaveBtn").addEventListener("click",function(){
    var btn=this,origLabel=btn.textContent;
    btn.disabled=true;btn.textContent=t("processing");
    var out=Object.assign({},curMeta);
    var keys=Object.keys(pendingImg);
    for(var i=0;i<keys.length;i++){
      var k=keys[i],v=pendingImg[k];
      if(v==="__clear__"){var prev=out[k]||{};out[k]=Object.assign({},prev,{img:""});}
      else{var prev2=out[k]||{};out[k]=Object.assign({},prev2,{img:v});}
    }
    api("/api/admin/nakrutka/catmeta","POST",out).then(function(){
      curMeta=out;pendingImg={};
      NkCache.catMeta=out; // ochiq bo'lgan bo'lsa mijoz keshini ham darhol yangilaymiz
      haptic("ok");toast(t("a_nk_images_saved"));renderList();
      btn.disabled=false;btn.textContent=origLabel;
    }).catch(function(){toast(t("srv_off"),true);btn.disabled=false;btn.textContent=origLabel;});
  });
}
function renderAdminList(sh){
  var c=catalog(),html="";
  for(var i=0;i<c.length;i++){
    var it=c[i],off=it.active===false;
    html+='<div class="itemrow'+(off?" offi":"")+'"><div><div class="nm">'+esc(loc(it.title))+'</div>'
      +'<div class="meta">'+esc(t("tab_"+(it.kind==="product"?"products":it.kind)))+' · '+esc(money(it.price))+' · '+it.stock+' dona</div></div>'
      +'<div class="acts">'
      +'<button data-aedit="'+esc(it.id)+'">'+ic("pencil",15)+'</button>'
      +'<button data-atoggle="'+esc(it.id)+'">'+(off?ic("eyeOff",15):ic("eye",15))+'</button>'
      +'<button data-adel="'+esc(it.id)+'">'+ic("trash",15)+'</button>'
      +'</div></div>';
  }
  var list=sh.querySelector("#aList");
  list.innerHTML=html||('<div class="paynote">'+esc(t("empty_section"))+'</div>');
  var eds=sh.querySelectorAll("[data-aedit]");
  for(var a=0;a<eds.length;a++)eds[a].addEventListener("click",function(){openAdminForm(this.getAttribute("data-aedit"));});
  var tgs=sh.querySelectorAll("[data-atoggle]");
  for(var b=0;b<tgs.length;b++)tgs[b].addEventListener("click",function(){
    var id=this.getAttribute("data-atoggle"),it=byId(id);if(!it)return;
    patchItem(id,{active:it.active===false});
    persist();renderAdminList(sh);render();
  });
  var dls=sh.querySelectorAll("[data-adel]");
  for(var d=0;d<dls.length;d++)dls[d].addEventListener("click",function(){
    var id=this.getAttribute("data-adel");
    deleteItem(id);persist();toast(t("a_del_done"));haptic();renderAdminList(sh);render();
  });
}
function isCustom(id){for(var i=0;i<S.custom.length;i++)if(S.custom[i].id===id)return true;return false;}
function patchItem(id,patch){
  if(S.imported){for(var i=0;i<S.imported.length;i++)if(S.imported[i].id===id){for(var k in patch)S.imported[i][k]=patch[k];}return;}
  if(isCustom(id)){for(var j=0;j<S.custom.length;j++)if(S.custom[j].id===id){for(var k2 in patch)S.custom[j][k2]=patch[k2];}return;}
  var p=S.over[id]||{};for(var k3 in patch)p[k3]=patch[k3];S.over[id]=p;
}
function deleteItem(id){
  if(S.imported){S.imported=S.imported.filter(function(x){return x.id!==id;});return;}
  if(isCustom(id)){S.custom=S.custom.filter(function(x){return x.id!==id;});return;}
  if(S.removed.indexOf(id)===-1)S.removed.push(id);
}

// Admin ro'yxati uchun: o'yin buyurtmasi qaysi liniyada va qanday holatda.
function gameLineNote(o){
  var l=o.line||{},nm=l.name?esc(l.name)+': ':'';
  if(l.state==="accepted")return '⏳ '+nm+'sayt qabul qildi'+(l.ref?' ('+esc(l.ref)+')':'')+' — bajarilishi kutilmoqda';
  if(l.state==="unknown")return '<b style="color:var(--warn)">❓ '+nm+'javob noaniq</b> — saytdan tekshiring';
  if(l.state==="failed")return '<span style="color:var(--err)">✕ '+nm+esc(l.message||"bajarilmadi")+'</span>';
  if(l.state==="manual")return '✋ '+(l.failedAll?'avtomatik liniyalar bajarmadi — ':'')+'qo\'lda bajaring';
  return '';
}
/* ===== admin: payments & clients ===== */
function openAdminMoney(prefillQ,backFn){
  var sh=openSheet('<h2>'+esc(t("adm_money"))+'</h2>'
    +'<div class="sect" style="margin:12px 0 8px">'+esc(t("adm_pending"))+'</div><div id="amPay">…</div>'
    +'<button class="btn sm gray" id="amAllTopupsBtn" style="width:100%;margin:8px 0 2px">'+ic("history",14)+' '+esc(t("a_all_topups"))+'</button>'
    +'<div class="sect" style="margin:16px 0 8px">'+esc(t("adm_orders_p"))+'</div><div id="amOrd">…</div>'
    +'<div class="sect" style="margin:16px 0 8px">'+esc(t("adm_search"))+'</div>'
    +'<div class="arow"><input id="admQ" placeholder="ID / @username" value="'+esc(prefillQ||"")+'"><button class="btn sm" id="admFind">'+esc(t("adm_find"))+'</button></div>'
    +'<div id="admRes" style="margin-top:10px"></div>',backFn||openAdmin);
  function reload(){
    api("/api/admin/list").then(function(r){
      var hp="";
      for(var i=0;i<r.payments.length;i++){
        var p=r.payments[i];
        hp+='<div class="itemrow"><div><div class="nm">'+esc(money(p.pay))+' · '+esc(p.method||"")+'</div>'
          +'<div class="meta">'+(p.uname?'@'+esc(p.uname)+' · ':'')+'ID '+esc(p.uid)+' · '+esc(fmtDate(p.ts))+' · '+esc(t(PAY_BADGE[p.status][1]))+'</div></div>'
          +'<div class="acts"><button data-apc="'+esc(p.id)+'">'+ic("check",15)+'</button><button data-apx="'+esc(p.id)+'">'+ic("cross",15)+'</button></div></div>';
      }
      sh.querySelector("#amPay").innerHTML=hp||'<div class="paynote">'+esc(t("adm_none"))+'</div>';
      var ho="";
      for(var j=0;j<r.orders.length;j++){
        var o=r.orders[j];
        // O'yin buyurtmasi: o'yinchi ID va qaysi liniyada nima bo'lgani.
        var gl=o.game?gameLineNote(o):"";
        var canRetry=o.game&&o.line&&(o.line.state==="manual"||o.line.state==="failed"||o.line.state==="unknown");
        ho+='<div class="itemrow"><div><div class="nm">'+esc(o.item)+' · '+esc(money(o.price))+'</div>'
          +(o.game&&o.game.accountText?'<div class="meta" style="color:var(--txt)">🎮 '+esc(o.game.accountText)+'</div>':'')
          +(gl?'<div class="meta">'+gl+'</div>':'')
          +'<div class="meta">'+(o.uname?'@'+esc(o.uname)+' · ':'')+'ID '+esc(o.uid)+' · <span class="code">'+esc(o.id)+'</span></div></div>'
          +'<div class="acts">'+(canRetry?'<button data-aor="'+esc(o.id)+'" data-st="'+esc(o.line.state)+'" title="Saytga qayta yuborish">↻</button>':'')
          +'<button data-aoc="'+esc(o.id)+'">'+ic("check",15)+'</button><button data-aox="'+esc(o.id)+'">'+ic("cross",15)+'</button></div></div>';
      }
      sh.querySelector("#amOrd").innerHTML=ho||'<div class="paynote">'+esc(t("adm_none"))+'</div>';
      function wire(sel,fn){var els=sh.querySelectorAll(sel);for(var k=0;k<els.length;k++)els[k].addEventListener("click",fn);}
      wire("[data-apc]",function(){payAct(this.getAttribute("data-apc"),"confirm");});
      wire("[data-apx]",function(){payAct(this.getAttribute("data-apx"),"cancel");});
      wire("[data-aoc]",function(){ordAct(this.getAttribute("data-aoc"),"done");});
      wire("[data-aox]",function(){ordAct(this.getAttribute("data-aox"),"cancel");});

    +'</div>'
    +'<div class="sect" style="margin:16px 0 6px">Premium emoji qo\'shish</div>'
    +'<div class="paynote" style="margin-top:0">Custom emoji ID va zaxira (fallback) belgisini kiritib, matn kursori turgan joyga qo\'shing.</div>'
    +'<div class="arow"><input id="bcEmojiId" placeholder="custom_emoji_id (raqam)" inputmode="numeric">'
    +'<input id="bcEmojiFb" placeholder="🙂" style="max-width:64px;text-align:center" maxlength="8"></div>'
    +'<div style="height:8px"></div><button class="btn sm gray" id="bcEmojiAdd" style="width:100%">'+ic("star",13)+' Emoji tokenini qo\'shish</button>'
    +'<div style="height:18px"></div>'
    +'<button class="btn gray" id="bcTestBtn">'+ic("send",15)+' Sinov yuborish (o\'zimga)</button>'
    +'<div style="height:8px"></div>'
    +'<button class="btn green" id="bcSendBtn">'+ic("send",15)+' Barchaga yuborish</button>'
    +'<div id="bcProgress" style="display:none;margin-top:14px">'
    +'<div class="paynote" style="margin-top:0" id="bcProgTxt">…</div>'
    +'<div style="height:8px;background:var(--line);border-radius:5px;overflow:hidden"><div id="bcProgBar" style="height:100%;width:0%;background:var(--acc,#2ecc71);transition:width .3s"></div></div>'
    +'</div>'
    +'<div class="sect" style="margin:20px 0 8px">Oxirgi yuborishlar</div><div id="bcHistory">…</div>'
    +'<div style="height:30px"></div>';
  var sh=openSheet(html,openAdmin);
  var limit=4096;
  function updateCount(){
    var n=sh.querySelector("#bcText").value.length;
    sh.querySelector("#bcCharCount").textContent=n+" / "+limit;
  }
  sh.querySelector("#bcText").addEventListener("input",updateCount);
  var segs=sh.querySelectorAll("#bcMediaSeg [data-bcm]");
  for(var i=0;i<segs.length;i++)segs[i].addEventListener("click",function(){
    for(var j=0;j<segs.length;j++)segs[j].classList.toggle("on",segs[j]===this);
    B.mediaType=this.getAttribute("data-bcm");
    B.mediaData="";B.mediaMime="";
    sh.querySelector("#bcFileInfo").textContent="";
    var fi=sh.querySelector("#bcFile");
    fi.accept=B.mediaType==="video"?"video/*":"image/*";
    sh.querySelector("#bcFileWrap").style.display=B.mediaType==="none"?"none":"block";
    limit=B.mediaType==="none"?4096:1024;
    updateCount();
  });
  sh.querySelector("#bcFile").addEventListener("change",function(){
    var f=this.files&&this.files[0];if(!f)return;
    if(f.size>13*1024*1024){toast("Fayl juda katta (video uchun max ~13MB)",true);this.value="";return;}
    if(B.mediaType==="photo"){
      // Boshqa admin rasm maydonlari kabi — brauzerda siqib, keyin base64 sifatida yuboriladi.
      var rd=new FileReader();
      rd.onload=function(){
        var im=new Image();
        im.onload=function(){
          try{
            var MAX=1280,w=im.width,h=im.height;
            if(w>MAX){h=Math.round(h*MAX/w);w=MAX;}
            if(h>MAX){w=Math.round(w*MAX/h);h=MAX;}
            var cv=document.createElement("canvas");cv.width=w;cv.height=h;
            cv.getContext("2d").drawImage(im,0,0,w,h);
            B.mediaData=cv.toDataURL("image/jpeg",0.85);
            B.mediaMime="image/jpeg";
            sh.querySelector("#bcFileInfo").textContent=f.name+" — tayyor";
          }catch(e){toast("Rasm xatosi",true);}
        };
        im.src=rd.result;
      };
      rd.readAsDataURL(f);
    }else{
      var rd2=new FileReader();
      rd2.onload=function(){
        B.mediaData=rd2.result;
        B.mediaMime=f.type||"video/mp4";
        sh.querySelector("#bcFileInfo").textContent=f.name+" — tayyor ("+(f.size/1024/1024).toFixed(1)+" MB)";
      };
      rd2.readAsDataURL(f);
    }
  });
  sh.querySelector("#bcEmojiAdd").addEventListener("click",function(){
    var idw=sh.querySelector("#bcEmojiId"),fbw=sh.querySelector("#bcEmojiFb"),ta=sh.querySelector("#bcText");
    var id=idw.value.trim(),fb=fbw.value.trim()||"🙂";
    if(!/^\d+$/.test(id)){toast("ID noto'g'ri — faqat raqamlardan iborat bo'lishi kerak",true);return;}
    var token="[emoji:"+id+":"+fb+"]";
    var start=ta.selectionStart||ta.value.length,end=ta.selectionEnd||ta.value.length;
    ta.value=ta.value.slice(0,start)+token+ta.value.slice(end);
    ta.focus();ta.selectionStart=ta.selectionEnd=start+token.length;
    updateCount();
    idw.value="";fbw.value="";
  });
  function sendBroadcast(test){
    var text=sh.querySelector("#bcText").value.trim();
    if(!text&&B.mediaType==="none"){toast("Matn kiriting yoki media biriktiring",true);return;}
    if(B.mediaType!=="none"&&!B.mediaData){toast("Avval fayl tanlang",true);return;}
    var body={text:text,mediaType:B.mediaType,mediaData:B.mediaData||null,test:!!test};
    var btn=sh.querySelector(test?"#bcTestBtn":"#bcSendBtn");
    var origHTML=btn.innerHTML;
    btn.disabled=true;btn.textContent=test?"Yuborilmoqda...":"Boshlanmoqda...";
    api("/api/admin/broadcast","POST",body).then(function(r){
      if(test){
        btn.disabled=false;btn.innerHTML=origHTML;
        if(r.ok)toast("Sinov xabari yuborildi ✅");else toast("Xatolik: "+(r.error||"noma'lum"),true);
        return;
      }
      sh.querySelector("#bcProgress").style.display="block";
      pollProgress();
    }).catch(function(e){
      btn.disabled=false;btn.innerHTML=origHTML;
      var msg=(e&&e.resp&&e.resp.error)||"xatolik";
      toast(msg==="already_running"?"Boshqa yuborish hali tugamagan":"Xatolik: "+msg,true);
    });
  }
  var pollT=null;
  function pollProgress(){
    clearTimeout(pollT);
    api("/api/admin/broadcast-status").then(function(r){
      var j=r.job;
      renderHistory(r.history);
      if(!j){sh.querySelector("#bcProgress").style.display="none";resetSendBtn();return;}
      var pct=j.total?Math.round(100*j.processed/j.total):0;
      sh.querySelector("#bcProgBar").style.width=pct+"%";
      sh.querySelector("#bcProgTxt").textContent="Yuborilmoqda: "+j.processed+" / "+j.total
        +" · ✅ "+j.sent+" · 🚫 "+j.blocked+" · ⚠️ "+j.failed;
      if(j.done){
        sh.querySelector("#bcProgTxt").textContent="Tugadi ✅ Yuborildi: "+j.sent+" · Bloklangan: "+j.blocked+" · Xato: "+j.failed+" (jami "+j.total+")";
        resetSendBtn();
        toast("Ommaviy xabar tugadi: "+j.sent+"/"+j.total);
      }else{
        pollT=setTimeout(pollProgress,1500);
      }
    }).catch(function(){pollT=setTimeout(pollProgress,2500);});
  }
  function resetSendBtn(){
    var btn=sh.querySelector("#bcSendBtn");
    btn.disabled=false;btn.innerHTML=ic("send",15)+' Barchaga yuborish';
  }
  var sendArmed=false,armT=null;
  sh.querySelector("#bcSendBtn").addEventListener("click",function(){
    var btn=this;
    if(!sendArmed){
      sendArmed=true;
      btn.innerHTML="✅ Tasdiqlash uchun yana bosing";
      clearTimeout(armT);
      armT=setTimeout(function(){sendArmed=false;btn.innerHTML=ic("send",15)+' Barchaga yuborish';},5000);
      return;
    }
    sendArmed=false;clearTimeout(armT);
    sendBroadcast(false);
  });
  sh.querySelector("#bcTestBtn").addEventListener("click",function(){sendBroadcast(true);});
  function renderHistory(list){
    var el=sh.querySelector("#bcHistory");if(!el)return;
    if(!list||!list.length){el.innerHTML='<div class="paynote">Hali yuborilmagan</div>';return;}
    var h="";
    for(var i=0;i<list.length;i++){
      var x=list[i];
      h+='<div class="itemrow"><div><div class="nm">'+esc(x.preview||"(media)")+'</div>'
        +'<div class="meta">'+esc(fmtDate(x.ts))+' · ✅ '+x.sent+' · 🚫 '+x.blocked+' · ⚠️ '+x.failed+' / '+x.total+'</div></div></div>';
    }
    el.innerHTML=h;
  }
  updateCount();
  api("/api/admin/broadcast-status").then(function(r){
    renderHistory(r.history);
    if(r.job&&!r.job.done){sh.querySelector("#bcProgress").style.display="block";pollProgress();}
  }).catch(function(){sh.querySelector("#bcHistory").innerHTML='<div class="paynote">'+esc(t("srv_off"))+'</div>';});
}
